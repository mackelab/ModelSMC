# @package _global_

defaults:
  - _self_
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    timeout_min: 600
    cpus_per_task: 8
    gpus_per_node: null
    tasks_per_node: 1
    mem_gb: 32
    nodes: 1
    name: ${hydra.job.name}
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    partition: 2080-galvani
    qos: null
    comment: null
    constraint: null
    exclude: null
    gres: gpu
    cpus_per_gpu: null
    gpus_per_task: null
    mem_per_gpu: null
    mem_per_cpu: null
    account: null
    signal_delay_s: 60
    max_num_timeout: 0
    array_parallelism: 256

    setup:
      # 1) Make srun inherit cpus-per-task and bind to those cores
      - "export SRUN_CPUS_PER_TASK=$SLURM_CPUS_PER_TASK"
      - "export SLURM_CPU_BIND=cores"

      # 2) Prevent library oversubscription
      - "export OMP_NUM_THREADS=1"
      - "export MKL_NUM_THREADS=1"
      - "export OPENBLAS_NUM_THREADS=1"
      - "export NUMEXPR_NUM_THREADS=1"

    additional_parameters:
      error: /dev/null
      output: /dev/null
      begin: now+60
      hint: nomultithread
