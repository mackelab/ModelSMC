[project]
name = "modelsmc"
version = "0.1.0"
description = "LLM-based model discovery with simulation-based inference"
authors = [
  { name = "Daniel Gedon", email = "daniel.gedon@uni-tuebingen.de" },
  { name = "Stefan Wahl", email = "stefan.wahl@uni-tuebingen.de" }
]
readme = "README.md"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "modelsmc" }]

[tool.poetry.dependencies]
python = ">=3.12, <3.13"
jupyter = "~=1.1.1"
hydra-core = "~=1.3.2"
hydra-submitit-launcher = "~=1.2.0"
hydra-optuna-sweeper = "~=1.1.2"
matplotlib = "~=3.10.0"
sbi = "~=0.23.3"
seaborn = "~=0.13.2"
tiktoken = "~=0.9.0"
ipdb = "~=0.13.13"
python-dotenv = "~=1.1.0"
torchdiffeq = "~=0.2.5"
dspy = "=3.0.1"
litellm = "=1.82.2"
torch = "~=2.2.2"
pytest = "^8.4.1"
pytorch-metric-learning = "~=1.6.3"
ray = "^2.49.1"
svgutils="=0.3.1"
tabpfn="=2.2.1"
pot = "^0.9.6.post1"
evotorch = "^0.6.1"
invoke = "^2.2.1"
pyfiglet = "^1.0.4"
tol-colors = "^2.2.0"
pyyaml = "^6.0"
datasets = "^4.6"
huggingface-hub = "^0.36"

[tool.poetry.scripts]
modelsmc = "modelsmc.main:main_wrapper"

[poetry.group.dev.dependencies]
ruff = "^0.12.0"
pytest = "^8.0.0"

[tool.ruff]
target-version = "py312"
line-length = 88
output-format = "full"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]